<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
      <span class="mark" aria-hidden="true">AD</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      {% assign here = page.url %}
      <a class="nv" href="{{ '/#work' | relative_url }}">Work</a>
      <a class="nv" href="{{ '/#demos' | relative_url }}">Demos</a>
      <a class="nv" href="{{ '/#proof' | relative_url }}">Proof</a>
      <a class="nv" href="{{ '/cv/' | relative_url }}" {% if here contains '/cv/' %}aria-current="page"{% endif %}>CV</a>
      <a class="nv" href="{{ '/posts/' | relative_url }}" {% if here contains '/posts/' %}aria-current="page"{% endif %}>Writing</a>
      <a class="nv" href="{{ '/about/' | relative_url }}" {% if here contains '/about/' %}aria-current="page"{% endif %}>About</a>
      <button type="button" class="kbar-btn" id="kbar-open" aria-label="Search the site"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><kbd>Ctrl K</kbd></button>
      <button type="button" class="theme" id="theme-toggle" aria-label="Switch colour theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <a class="nav-cta" href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>
