---
layout: default
---
<article class="wrap page">
  <header class="page-head">
    {% if page.kicker %}<span class="kicker">{{ page.kicker }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
