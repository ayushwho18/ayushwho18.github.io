<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
{% if page.styles %}{% for s in page.styles %}<link rel="stylesheet" href="{{ s | relative_url }}">{% endfor %}{% endif %}
</head>
<body class="{{ page.body_class }}">
<div class="progress" aria-hidden="true"></div>
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script>window.SITE={posts:[{% for p in site.posts limit:20 %}{t:{{ p.title | jsonify }},u:{{ p.url | relative_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],email:{{ site.author.email | jsonify }}};</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{% if page.three %}<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js" defer></script>{% endif %}
{% if page.scripts %}{% for s in page.scripts %}<script src="{{ s | relative_url }}" defer></script>{% endfor %}{% endif %}
</body>
</html>
