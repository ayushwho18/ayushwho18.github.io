# "Objections, answered". Edit answers here; the home page and /for/ pages read this file.
- q: "Why leave government?"
  a: "I am not leaving a career; I am finishing a programme. The CM Good Governance Fellowship is a fixed term that ends in March 2027 (tentative). I want to work on the private side of the same problem I have worked on inside it: making land and registration records usable."
- q: "Will you bring government data or access?"
  a: "No, and I will never offer it. What I bring is how the system works, how officers think, and what breaks on the ground. Everything on this site uses public sources or synthetic data."
- q: "Can you code?"
  a: "I am not a software engineer. I vibe code: I build working prototypes by directing AI coding tools, including every demo on this site. I work in Excel and Power BI daily, and I can read an API spec, write a clear ticket and test what engineers ship."
- q: "Can you work without structure?"
  a: "The fellowship has none. I report to a department Secretary's office across three departments, decide my own priorities, and ship documents that officers act on. Two of my 30 registration reforms were directed for implementation."
- q: "When can you join?"
  a: "April 2027, after the fellowship ends and I graduate from IIM Raipur. I cannot take paid work before that under fellowship rules, but I am happy to talk now."
- q: "What salary do you expect?"
  a: "Open to discuss. I would rather agree on the scope of the role first, and I am happy to talk numbers on a call."
